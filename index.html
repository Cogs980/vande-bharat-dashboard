<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; }
header { background: linear-gradient(135deg, #1a2a4a 0%, #0d3b6e 100%); padding: 14px 24px; display: flex; align-items: center; gap: 14px; border-bottom: 2px solid #f97316; flex-wrap: wrap; }
header h1 { font-size: 1.35rem; font-weight: 700; color: #fff; }
.hbadge { background: #f97316; color: #fff; font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.hbadge.green { background: #16a34a; }
.main { display: grid; grid-template-columns: 350px 1fr; height: calc(100vh - 58px); }
.sidebar { background: #161b27; overflow-y: auto; padding: 14px; border-right: 1px solid #2d3748; display: flex; flex-direction: column; gap: 10px; }
.filter-section { background: #1e2535; border-radius: 10px; padding: 12px; }
.filter-section h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; margin-bottom: 9px; }
.search-box { width: 100%; padding: 9px 12px; background: #0f1117; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 0.88rem; }
.search-box:focus { outline: none; border-color: #f97316; }
.btn-group { display: flex; flex-wrap: wrap; gap: 5px; }
.filter-btn { padding: 4px 11px; font-size: 0.75rem; border-radius: 999px; border: 1px solid #334155; background: transparent; color: #94a3b8; cursor: pointer; transition: all 0.2s; }
.filter-btn:hover, .filter-btn.active { background: #f97316; border-color: #f97316; color: #fff; font-weight: 600; }
.filter-btn.type-sleeper.active { background: #7c3aed; border-color: #7c3aed; }
.stats-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
.stat-card { background: #1e2535; border-radius: 8px; padding: 9px; text-align: center; }
.stat-num { font-size: 1.35rem; font-weight: 700; color: #f97316; }
.stat-lbl { font-size: 0.68rem; color: #64748b; margin-top: 2px; }
.route-list { flex: 1; overflow-y: auto; }
.route-card { background: #1e2535; border-radius: 8px; padding: 11px; margin-bottom: 7px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.2s; }
.route-card:hover { border-left-color: #f97316; background: #253048; }
.route-card.active { border-left-color: #f97316; background: #253048; }
.rno { font-size: 0.68rem; color: #64748b; font-family: monospace; }
.rname { font-size: 0.85rem; font-weight: 600; color: #e2e8f0; margin: 3px 0; }
.timing-row { display: flex; align-items: center; gap: 10px; margin: 5px 0; background: #0f1117; border-radius: 6px; padding: 6px 10px; }
.timing-dep { font-size: 1.05rem; font-weight: 800; color: #4ade80; }
.timing-arr { font-size: 1.05rem; font-weight: 800; color: #f87171; }
.timing-arrow { color: #64748b; font-size: 0.8rem; flex: 1; text-align: center; }
.timing-dur { font-size: 0.72rem; color: #94a3b8; text-align: center; }
.timing-dist { font-size: 0.72rem; color: #fbbf24; }
.rmeta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.tag { font-size: 0.66rem; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
.tag-region { background: #1e3a5f; color: #60a5fa; }
.tag-coaches { background: #1a3320; color: #4ade80; }
.tag-type { background: #2d1a4a; color: #c084fc; }
.tag-freq { background: #1a2a1a; color: #86efac; }
.action-links { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
.action-links a { font-size: 0.67rem; padding: 3px 8px; border-radius: 5px; text-decoration: none; font-weight: 600; }
.a-live { background: #dc2626; color: #fff; }
.a-sched { background: #0284c7; color: #fff; }
.a-book { background: #16a34a; color: #fff; }
#map { width: 100%; height: 100%; z-index: 1; }
.no-results { color: #64748b; text-align: center; padding: 40px 20px; font-size: 0.9rem; }
.count-label { font-size: 0.73rem; color: #64748b; padding: 3px 2px; }

/* Map Popup Timing Card */
.popup-timing { background: #0f1117; border-radius: 8px; padding: 10px 14px; margin: 8px 0; }
.popup-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.popup-dep { font-size: 1.2rem; font-weight: 800; color: #4ade80; }
.popup-arr { font-size: 1.2rem; font-weight: 800; color: #f87171; }
.popup-mid { text-align: center; color: #64748b; font-size: 0.75rem; }
.popup-title { font-weight: 700; font-size: 0.95rem; color: #e2e8f0; margin-bottom: 4px; }
.popup-meta { font-size: 0.75rem; color: #94a3b8; margin-top: 6px; }
.popup-links { margin-top: 8px; display: flex; gap: 6px; }
.popup-links a { font-size: 0.72rem; padding: 3px 9px; border-radius: 5px; text-decoration: none; font-weight: 700; }
.leaflet-popup-content { min-width: 240px !important; }
.leaflet-popup-content-wrapper { background: #1e2535 !important; border: 1px solid #334155; color: #e2e8f0; border-radius: 10px !important; }
.leaflet-popup-tip { background: #1e2535 !important; }
</style>

let activeRegion="All", activeType="All", activeCoaches="All", searchVal="";
let mapLines=[], mapMarkers=[];
let selectedTrain=null;

const map = L.map('map').setView([22.5, 82.0], 5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'© OpenStreetMap © CARTO', maxZoom:18
}).addTo(map);

function getColor(region){
  const c={North:"#f97316",South:"#22c55e",East:"#60a5fa",West:"#f59e0b",
    "East-Central":"#a78bfa","North-Central":"#fb7185","West-Central":"#34d399"};
  return c[region]||"#94a3b8";
}

function filterRoutes(){
  return routes.filter(r=>{
    const mR=activeRegion==="All"||r.region===activeRegion;
    const mT=activeType==="All"||r.type===activeType;
    const mC=activeCoaches==="All"||r.coaches===parseInt(activeCoaches);
    const q=searchVal.toLowerCase();
    const mS=!q||r.from.toLowerCase().includes(q)||r.to.toLowerCase().includes(q)||
      r.route.toLowerCase().includes(q)||r.states.toLowerCase().includes(q)||
      r.train.toLowerCase().includes(q)||r.region.toLowerCase().includes(q);
    return mR&&mT&&mC&&mS;
  });
}

function timingRow(dep,arr,dur,dist){
  return `<div class="timing-row">
    <div><div class="timing-dep">🟢 ${dep}</div><div style="font-size:0.62rem;color:#64748b">DEP</div></div>
    <div class="timing-arrow">──── ${dur} ────<br><span class="timing-dist">📍${dist}</span></div>
    <div><div class="timing-arr">🔴 ${arr}</div><div style="font-size:0.62rem;color:#64748b;text-align:right">ARR</div></div>
  </div>`;
}

function renderList(){
  const filtered=filterRoutes();
  document.getElementById('countLabel').textContent=`Showing ${filtered.length} routes`;
  document.getElementById('st-total').textContent=filtered.length;
  document.getElementById('st-chair').textContent=filtered.filter(r=>r.type==="Chair Car").length;
  document.getElementById('st-sleep').textContent=filtered.filter(r=>r.type==="Sleeper").length;

  const list=document.getElementById('routeList');
  if(filtered.length===0){list.innerHTML='<div class="no-results">No routes match your filters</div>';renderMap([]);return;}
  list.innerHTML=filtered.map(r=>`
    <div class="route-card ${selectedTrain===r.train?'active':''}" onclick="selectRoute('${r.train}')">
      <div class="rno">${r.train}</div>
      <div class="rname">${r.from} ↔ ${r.to}</div>
      ${timingRow(r.dep, r.arr, r.dur, r.dist)}
      <div class="rmeta">
        <span class="tag tag-region">${r.region}</span>
        <span class="tag tag-coaches">${r.coaches}-car</span>
        <span class="tag tag-type">${r.type}</span>
        <span class="tag tag-freq">${r.freq}</span>
      </div>
      <div style="font-size:0.68rem;color:#64748b;margin-top:4px;">📍 ${r.states}</div>
      <div class="action-links">
        <a class="a-live" href="${r.live}" target="_blank">🔴 Live Status</a>
        <a class="a-sched" href="${r.schedule}" target="_blank">📅 Schedule</a>
        <a class="a-book" href="${r.book}" target="_blank">🎫 Book IRCTC</a>
      </div>
    </div>`).join('');
  renderMap(filtered);
}

function buildPopup(r){
  const col=getColor(r.region);
  return `<div>
    <div class="popup-title" style="color:${col}">${r.train}</div>
    <div style="font-size:0.82rem;font-weight:600;margin-bottom:6px;">${r.from} <span style="color:#64748b">↔</span> ${r.to}</div>
    <div class="popup-timing">
      <div class="popup-row">
        <div><div class="popup-dep">${r.dep}</div><div style="font-size:0.62rem;color:#64748b">DEPARTURE</div></div>
        <div class="popup-mid">▶ ${r.dur} ▶<br><span style="color:#fbbf24;font-size:0.7rem;">${r.dist}</span></div>
        <div style="text-align:right"><div class="popup-arr">${r.arr}</div><div style="font-size:0.62rem;color:#64748b">ARRIVAL</div></div>
      </div>
    </div>
    <div class="popup-meta">
      <span style="color:#60a5fa">${r.region}</span> &nbsp;|&nbsp;
      <span style="color:#4ade80">${r.coaches}-coach</span> &nbsp;|&nbsp;
      <span style="color:#c084fc">${r.type}</span><br>
      🗓️ ${r.freq} &nbsp;|&nbsp; 📍 ${r.states}
    </div>
    <div class="popup-links">
      <a class="a-live" href="${r.live}" target="_blank">🔴 Live</a>
      <a class="a-sched" href="${r.schedule}" target="_blank">📅 Schedule</a>
      <a class="a-book" href="${r.book}" target="_blank">🎫 Book</a>
    </div>
  </div>`;
}

function renderMap(filtered){
  mapLines.forEach(l=>map.removeLayer(l));
  mapMarkers.forEach(m=>map.removeLayer(m));
  mapLines=[];mapMarkers=[];

  filtered.forEach(r=>{
    if(!r.from_lat||!r.to_lat) return;
    const col=getColor(r.region);
    const isSel=selectedTrain===r.train;
    const line=L.polyline([[r.from_lat,r.from_lon],[r.to_lat,r.to_lon]],{
      color:col,weight:isSel?5:1.8,opacity:isSel?1:0.55,
      dashArray:r.type==='Sleeper'?'8,4':null
    }).addTo(map);
    line.bindPopup(buildPopup(r),{maxWidth:280});
    if(isSel) line.openPopup();
    mapLines.push(line);

    [[r.from_lat,r.from_lon,r.from,r.dep,"DEP"],[r.to_lat,r.to_lon,r.to,r.arr,"ARR"]].forEach(([lat,lon,name,time,label])=>{
      const dot=L.circleMarker([lat,lon],{radius:isSel?6:3.5,fillColor:col,color:'#fff',weight:isSel?2:1,fillOpacity:0.9}).addTo(map);
      dot.bindTooltip(`<b>${name}</b><br>${label}: ${time}`,{permanent:false,direction:'top',className:''});
      mapMarkers.push(dot);
    });
  });
}

function selectRoute(trainNo){
  selectedTrain=selectedTrain===trainNo?null:trainNo;
  renderList();
  if(selectedTrain){
    const r=routes.find(x=>x.train===trainNo);
    if(r&&r.from_lat&&r.to_lat)
      map.fitBounds([[r.from_lat,r.from_lon],[r.to_lat,r.to_lon]],{padding:[80,80]});
  }
}

document.getElementById('regionFilters').addEventListener('click',e=>{
  if(!e.target.dataset.region) return;
  activeRegion=e.target.dataset.region;
  document.querySelectorAll('#regionFilters .filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.region===activeRegion));
  renderList();
});
document.getElementById('typeFilters').addEventListener('click',e=>{
  if(!e.target.dataset.type) return;
  activeType=e.target.dataset.type;
  document.querySelectorAll('#typeFilters .filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===activeType));
  renderList();
});
document.getElementById('coachFilters').addEventListener('click',e=>{
  if(!e.target.dataset.coaches) return;
  activeCoaches=e.target.dataset.coaches;
  document.querySelectorAll('#coachFilters .filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.coaches===activeCoaches));
  renderList();
});
document.getElementById('searchInput').addEventListener('input',e=>{
  searchVal=e.target.value;
  renderList();
});

renderList();
</script>
